<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Placeholder Frames</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: monospace;
      background: #000;
      color: #0f0;
    }
    #status {
      margin: 20px 0;
      padding: 20px;
      background: #111;
      border: 1px solid #0f0;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Placeholder Frame Generator</h1>
  <div id="status">Initializing...</div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');

    // Set canvas size (9:16 portrait aspect ratio)
    canvas.width = 1080;
    canvas.height = 1920;

    const FRAME_COUNT = 89;

    async function generateFrame(frameNum) {
      // Clear canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Calculate progress (0 to 1)
      const progress = frameNum / (FRAME_COUNT - 1);

      // Background gradient
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, `rgb(${Math.floor(10 + progress * 20)}, ${Math.floor(13 + progress * 30)}, ${Math.floor(26 + progress * 50)})`);
      gradient.addColorStop(1, `rgb(${Math.floor(7)}, ${Math.floor(13)}, ${Math.floor(26)})`);
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw phone outline (simplified)
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      // Phone body
      const phoneWidth = 400;
      const phoneHeight = 800;
      const phoneRadius = 60;

      // Calculate explode offset based on progress
      const explodeOffset = progress * 300; // Max 300px separation

      // Draw back glass (moves down)
      ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + progress * 0.2})`;
      ctx.strokeStyle = `rgba(77, 148, 255, ${0.3 + progress * 0.5})`;
      ctx.lineWidth = 3;
      roundRect(ctx, centerX - phoneWidth/2, centerY - phoneHeight/2 + explodeOffset * 3, phoneWidth, phoneHeight, phoneRadius);
      ctx.fill();
      ctx.stroke();

      // Draw battery (moves down)
      ctx.fillStyle = `rgba(0, 255, 204, ${0.2 + progress * 0.3})`;
      ctx.strokeStyle = `rgba(0, 255, 204, ${0.5 + progress * 0.5})`;
      roundRect(ctx, centerX - 150, centerY - 100 + explodeOffset * 2, 300, 120, 20);
      ctx.fill();
      ctx.stroke();

      // Draw motherboard (center)
      ctx.fillStyle = `rgba(0, 200, 100, ${0.2 + progress * 0.3})`;
      ctx.strokeStyle = `rgba(0, 255, 100, ${0.5 + progress * 0.5})`;
      roundRect(ctx, centerX - 180, centerY - 150 + explodeOffset, 360, 240, 15);
      ctx.fill();
      ctx.stroke();

      // Draw display (moves up)
      ctx.fillStyle = `rgba(100, 150, 255, ${0.15 + progress * 0.25})`;
      ctx.strokeStyle = `rgba(77, 148, 255, ${0.4 + progress * 0.5})`;
      roundRect(ctx, centerX - phoneWidth/2, centerY - phoneHeight/2 - explodeOffset * 2, phoneWidth, phoneHeight, phoneRadius);
      ctx.fill();
      ctx.stroke();

      // Draw front glass (moves up most)
      ctx.fillStyle = `rgba(255, 255, 255, ${0.05 + progress * 0.15})`;
      ctx.strokeStyle = `rgba(200, 220, 255, ${0.3 + progress * 0.4})`;
      roundRect(ctx, centerX - phoneWidth/2, centerY - phoneHeight/2 - explodeOffset * 3.5, phoneWidth, phoneHeight, phoneRadius);
      ctx.fill();
      ctx.stroke();

      // Add Glyph LED strips (on back)
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.3 + progress * 0.6})`;
      ctx.lineWidth = 4;
      const glyphX = centerX;
      const glyphY = centerY + explodeOffset * 3;

      // Vertical strip
      ctx.beginPath();
      ctx.moveTo(glyphX + 80, glyphY - 200);
      ctx.lineTo(glyphX + 80, glyphY + 200);
      ctx.stroke();

      // Horizontal strip
      ctx.beginPath();
      ctx.moveTo(glyphX - 100, glyphY + 150);
      ctx.lineTo(glyphX + 100, glyphY + 150);
      ctx.stroke();

      // Frame number
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.font = '48px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(`FRAME ${String(frameNum + 1).padStart(3, '0')}`, centerX, 150);

      // Progress text
      ctx.fillStyle = 'rgba(77, 148, 255, 0.8)';
      ctx.font = '32px monospace';
      ctx.fillText(`${Math.round(progress * 100)}%`, centerX, 200);

      // "NOTHING PHONE 3" text
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.font = 'bold 56px sans-serif';
      ctx.fillText('NOTHING PHONE 3', centerX, canvas.height - 150);

      return canvas.toDataURL('image/webp', 0.8);
    }

    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      ctx.lineTo(x + radius, y + height);
      ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
      ctx.lineTo(x, y + radius);
      ctx.quadraticCurveTo(x, y, x + radius, y);
      ctx.closePath();
    }

    async function downloadFrame(dataUrl, frameNum) {
      const link = document.createElement('a');
      link.download = `frame_${String(frameNum + 1).padStart(3, '0')}.webp`;
      link.href = dataUrl;
      link.click();
    }

    async function generateAllFrames() {
      status.innerHTML = '<p>Generating frames... This will download 89 WebP files.</p>';
      status.innerHTML += '<p><strong>NOTE:</strong> Save all files to public/sequence/ directory</p>';

      for (let i = 0; i < FRAME_COUNT; i++) {
        const dataUrl = await generateFrame(i);
        await downloadFrame(dataUrl, i);

        status.innerHTML = `<p>Generated frame ${i + 1} of ${FRAME_COUNT}</p>`;
        status.innerHTML += `<p>Progress: ${Math.round((i + 1) / FRAME_COUNT * 100)}%</p>`;

        // Small delay to allow browser to process
        await new Promise(resolve => setTimeout(resolve, 100));
      }

      status.innerHTML = '<p style="color: #0f0; font-size: 24px;">✓ All frames generated!</p>';
      status.innerHTML += '<p>Move all downloaded frames to: <code>public/sequence/</code></p>';
    }

    // Auto-start generation
    generateAllFrames();
  </script>
</body>
</html>
